name: collabora

on:
  push:
    branches: [main]
    paths:
      - 'collabora/**'
      - '.github/workflows/collabora.yml'
      - '.trivyignore'
  pull_request:
    paths:
      - 'collabora/**'
      - '.github/workflows/collabora.yml'
      - '.trivyignore'
  workflow_dispatch:
    inputs:
      collabora_version:
        description: "Override upstream Collabora version (e.g. 24.04.11.4.1)"
        required: false

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build:
    name: build / collabora
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream Collabora version
        id: ver
        run: |
          DEFAULT=$(grep -E '^ARG COLLABORA_VERSION=' collabora/Dockerfile | head -1 | cut -d= -f2)
          VER="${{ inputs.collabora_version }}"
          VER="${VER:-$DEFAULT}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/collabora-fonts
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v5
        with:
          context: collabora
          push: true
          platforms: linux/amd64
          build-args: |
            COLLABORA_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=collabora
          cache-to: type=gha,mode=max,scope=collabora

  test:
    name: test / collabora
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          DEFAULT=$(grep -E '^ARG COLLABORA_VERSION=' collabora/Dockerfile | head -1 | cut -d= -f2)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          else
            TAG="${DEFAULT}"
          fi
          IMG="ghcr.io/$OWNER/collabora-fonts:$TAG"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - run: docker pull "${{ steps.img.outputs.image }}"

      - name: Font smoke tests — representative font from each group
        run: |
          IMG="${{ steps.img.outputs.image }}"
          # collabora image runs as user `cool` by default; fc-list needs no special privs
          docker run --rm "$IMG" sh -c 'fc-list | grep -qi "Times New Roman"'  || { echo "::error::missing Times New Roman (ttf-mscorefonts-installer)"; exit 1; }
          docker run --rm "$IMG" sh -c 'fc-list | grep -qi "Carlito"'          || { echo "::error::missing Carlito (Calibri substitute)";   exit 1; }
          docker run --rm "$IMG" sh -c 'fc-list | grep -qi "Caladea"'          || { echo "::error::missing Caladea (Cambria substitute)";   exit 1; }
          docker run --rm "$IMG" sh -c 'fc-list | grep -qi "Liberation Sans"'  || { echo "::error::missing Liberation Sans";                exit 1; }
          docker run --rm "$IMG" sh -c 'fc-list | grep -qi "DejaVu Sans"'      || { echo "::error::missing DejaVu Sans";                    exit 1; }
          docker run --rm "$IMG" sh -c 'fc-list | grep -qi "Noto"'             || { echo "::error::missing Noto";                           exit 1; }
          docker run --rm "$IMG" sh -c 'fc-list | grep -qi "Roboto"'           || { echo "::error::missing Roboto";                         exit 1; }

      - name: Boot test — Collabora answers /hosting/discovery
        run: |
          IMG="${{ steps.img.outputs.image }}"
          docker run -d --name col -p 9980:9980 \
            -e "extra_params=--o:ssl.enable=false --o:ssl.termination=true" \
            -e "domain=localhost" \
            "$IMG"
          ok=0
          for i in $(seq 1 30); do
            sleep 3
            if curl -sf http://localhost:9980/hosting/discovery > /tmp/disco.xml 2>/dev/null; then
              ok=1; break
            fi
            echo "waiting for collabora ($i/30)..."
          done
          [ $ok -eq 1 ] || { echo "::error::/hosting/discovery never answered"; exit 1; }
          head -c 500 /tmp/disco.xml
          # discovery XML should contain mime-types and wopi action elements
          grep -q "wopi-discovery\|application/vnd" /tmp/disco.xml \
            || { echo "::error::discovery XML did not contain expected elements"; exit 1; }

      - name: Container logs on failure
        if: failure()
        run: docker logs col | tail -300 || true

      - name: Trivy scan (HIGH/CRITICAL, fixable only) — advisory
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.img.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  automerge:
    name: automerge / renovate
    needs: [build, test]
    if: github.event_name == 'pull_request' && github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
