name: Build, test, and publish

on:
  push:
    branches: [main]
    paths:
      - '*/Dockerfile'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - '*/Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      nextcloud_version:
        description: "Override upstream Nextcloud version (e.g. 33.0.4)"
        required: false

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build:
    name: build / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add a new variant by creating <name>/Dockerfile and appending here.
        variant: [apache]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream Nextcloud version
        id: ver
        run: |
          DEFAULT=$(grep -E '^ARG NEXTCLOUD_VERSION=' ${{ matrix.variant }}/Dockerfile | head -1 | cut -d= -f2)
          VER="${{ inputs.nextcloud_version }}"
          VER="${VER:-$DEFAULT}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nextcloud-${{ matrix.variant }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}-${{ matrix.variant }}
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=sha,prefix={{branch}}-

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.variant }}
          push: true
          platforms: linux/amd64
          build-args: |
            NEXTCLOUD_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  test:
    name: test / ${{ matrix.variant }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [apache]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag we just built
        id: img
        run: |
          DEFAULT=$(grep -E '^ARG NEXTCLOUD_VERSION=' ${{ matrix.variant }}/Dockerfile | head -1 | cut -d= -f2)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          else
            TAG="${DEFAULT}-${{ matrix.variant }}"
          fi
          IMG="ghcr.io/${{ github.repository_owner }}/nextcloud-${{ matrix.variant }}:$TAG"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - run: docker pull "${{ steps.img.outputs.image }}"

      - name: Binary smoke tests
        run: |
          IMG="${{ steps.img.outputs.image }}"
          docker run --rm "$IMG" ffmpeg  -version | head -1
          docker run --rm "$IMG" ffprobe -version | head -1
          docker run --rm "$IMG" smbclient --version

      - name: PHP modules present
        run: |
          IMG="${{ steps.img.outputs.image }}"
          docker run --rm "$IMG" php -m > mods.txt
          cat mods.txt
          for mod in imagick pdo_pgsql gd zip intl bcmath; do
            grep -qi "^$mod$" mods.txt || { echo "::error::missing PHP module: $mod"; exit 1; }
          done

      - name: Apache configtest
        if: matrix.variant == 'apache'
        run: docker run --rm "${{ steps.img.outputs.image }}" apache2ctl configtest

      - name: occ runs
        run: docker run --rm "${{ steps.img.outputs.image }}" php /var/www/html/occ --version

      - name: End-to-end boot against a real Postgres
        run: |
          IMG="${{ steps.img.outputs.image }}"
          docker network create nctest
          docker run -d --name pg --network nctest \
            -e POSTGRES_PASSWORD=testpw \
            -e POSTGRES_USER=nextcloud \
            -e POSTGRES_DB=nextcloud \
            postgres:16
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U nextcloud -d nextcloud >/dev/null 2>&1 && break
            sleep 2
          done
          docker run -d --name nc --network nctest \
            -e POSTGRES_HOST=pg \
            -e POSTGRES_PASSWORD=testpw \
            -e POSTGRES_USER=nextcloud \
            -e POSTGRES_DB=nextcloud \
            -e NEXTCLOUD_ADMIN_USER=admin \
            -e NEXTCLOUD_ADMIN_PASSWORD=testpwtestpwtestpw \
            -e NEXTCLOUD_TRUSTED_DOMAINS=localhost \
            -p 8080:80 \
            "$IMG"
          ok=0
          for i in $(seq 1 40); do
            sleep 5
            if curl -sf http://localhost:8080/status.php > /tmp/status.json; then
              ok=1; break
            fi
            echo "waiting ($i/40)..."
          done
          [ $ok -eq 1 ] || { echo "::error::status.php never returned"; exit 1; }
          cat /tmp/status.json
          grep -q '"installed":true' /tmp/status.json

      - name: Container logs on failure
        if: failure()
        run: |
          echo "--- nc ---" && docker logs nc | tail -300 || true
          echo "--- pg ---" && docker logs pg | tail -100 || true

      - name: Trivy scan (HIGH/CRITICAL, fixable only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.img.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  automerge:
    name: automerge / renovate
    needs: [build, test]
    if: github.event_name == 'pull_request' && github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
